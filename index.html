<body>

  <!-- 原創吉祥物插畫（供全站重複使用） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="mascot" viewBox="0 0 200 240">
        <radialGradient id="mascotGlow" cx="50%" cy="42%" r="60%">
          <stop offset="0%" stop-color="#7ee8ff" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#7ee8ff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="mascotFlame" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3a2a8f"/>
          <stop offset="45%" stop-color="#7b3ff2"/>
          <stop offset="78%" stop-color="#c04fe8"/>
          <stop offset="100%" stop-color="#4fd6ff"/>
        </linearGradient>
        <linearGradient id="mascotRim" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffe9a8"/>
          <stop offset="100%" stop-color="#ffcf5c"/>
        </linearGradient>

        <circle cx="100" cy="120" r="95" fill="url(#mascotGlow)"/>

        <!-- 飄浮光環 -->
        <ellipse cx="100" cy="12" rx="30" ry="9" fill="none" stroke="url(#mascotRim)" stroke-width="3" opacity="0.9"/>

        <!-- 星芒 -->
        <g fill="#ffe9a8">
          <path d="M36 74 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" opacity="0.85"/>
          <path d="M168 100 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z" opacity="0.8"/>
          <circle cx="152" cy="64" r="2.5" opacity="0.75"/>
        </g>

        <!-- 尾焰 -->
        <path d="M100 150 C70 175 65 205 85 222 C75 210 82 190 100 178 C118 190 125 210 115 222 C135 205 130 175 100 150 Z"
              fill="url(#mascotFlame)" opacity="0.9"/>

        <!-- 精靈本體 -->
        <path d="M100 34
                 C136 58 154 96 148 130
                 C143 158 127 176 100 186
                 C73 176 57 158 52 130
                 C46 96 64 58 100 34 Z"
              fill="url(#mascotFlame)"/>

        <path d="M100 34 C136 58 154 96 148 130 C143 158 127 176 100 186"
              fill="none" stroke="url(#mascotRim)" stroke-width="2.5" opacity="0.55"/>

        <!-- 自信瞇眼 -->
        <path d="M70 110 Q82 100 96 108" fill="none" stroke="#101025" stroke-width="6" stroke-linecap="round"/>
        <path d="M104 108 Q118 100 130 110" fill="none" stroke="#101025" stroke-width="6" stroke-linecap="round"/>
        <circle cx="90" cy="105" r="2.2" fill="#eafcff"/>
        <circle cx="112" cy="105" r="2.2" fill="#eafcff"/>

        <!-- 微笑 -->
        <path d="M84 134 Q100 144 118 130" fill="none" stroke="#101025" stroke-width="5" stroke-linecap="round"/>

        <ellipse cx="66" cy="124" rx="7" ry="4.5" fill="#ff9ad6" opacity="0.4"/>
        <ellipse cx="134" cy="124" rx="7" ry="4.5" fill="#ff9ad6" opacity="0.4"/>

        <path d="M76 166 Q100 178 124 166" fill="none" stroke="url(#mascotRim)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
      </symbol>
    </defs>
  </svg>

  <!-- 魔法陣入場動畫 -->
  <section id="intro-screen" class="intro-screen">
    <h1 class="intro-title">今天吃什麼？</h1>
    <p class="intro-subtitle">踏入魔法陣，召喚美食精靈</p>

    <div class="lamp-wrap" id="lamp-wrap">
      <div class="mc-scan"></div>
      <svg class="mc-ring mc-ring-outer" viewBox="0 0 300 300">
        <polygon points="150,14 253,82 253,218 150,286 47,218 47,82" fill="none" stroke="#5ad2ff" stroke-width="1.2" opacity="0.6"/>
        <circle cx="150" cy="150" r="140" fill="none" stroke="#8fe9ff" stroke-width="1" stroke-dasharray="1 7" opacity="0.7"/>
        <circle cx="150" cy="150" r="132" fill="none" stroke="#2ea8e0" stroke-width="3" stroke-dasharray="18 6" opacity="0.5"/>
        <rect x="146" y="8" width="8" height="8" fill="#8fe9ff"/>
        <rect x="146" y="284" width="8" height="8" fill="#8fe9ff"/>
        <rect x="8" y="146" width="8" height="8" fill="#8fe9ff"/>
        <rect x="284" y="146" width="8" height="8" fill="#8fe9ff"/>
      </svg>
      <svg class="mc-ring mc-ring-mid" viewBox="0 0 300 300">
        <polygon points="150,55 227,187 73,187" fill="none" stroke="#7be8ff" stroke-width="1.2" opacity="0.8"/>
        <polygon points="150,245 73,113 227,113" fill="none" stroke="#7be8ff" stroke-width="1.2" opacity="0.8"/>
        <circle cx="150" cy="150" r="96" fill="none" stroke="#3ec6ff" stroke-width="0.8" opacity="0.55"/>
        <circle cx="150" cy="150" r="104" fill="none" stroke="#1c8fd6" stroke-width="1" stroke-dasharray="3 5" opacity="0.5"/>
      </svg>
      <svg class="mc-ring mc-ring-inner" viewBox="0 0 300 300">
        <circle cx="150" cy="150" r="62" fill="none" stroke="#bff3ff" stroke-width="2.5" stroke-dasharray="1 8" opacity="0.9"/>
        <rect x="146" y="38" width="8" height="8" fill="#d6faff" transform="rotate(45 150 42)"/>
        <rect x="146" y="254" width="8" height="8" fill="#d6faff" transform="rotate(45 150 258)"/>
        <rect x="38" y="146" width="8" height="8" fill="#d6faff" transform="rotate(45 42 150)"/>
        <rect x="254" y="146" width="8" height="8" fill="#d6faff" transform="rotate(45 258 150)"/>
      </svg>
      <div class="mc-glow"></div>
      <div class="lamp" id="lamp" role="button" tabindex="0" aria-label="啟動魔法陣"></div>
    </div>

    <p class="intro-hint" id="intro-hint">點一下魔法陣試試看 ✨</p>
    <button class="enter-btn" id="enter-btn" hidden>帶我進入美食世界 →</button>

  <!-- 主體 App -->
  <main class="app" id="app" hidden>

    <header>
      <h1>🍽️ 今天吃什麼？</h1>
      <p class="subtitle">回答精靈的 5 個問題，讓祂幫你決定！</p>
    </header>

    <section class="quiz" id="quiz">
      <div class="step-dots" id="step-dots"></div>
      <div class="quiz-slide" id="quiz-slide" aria-live="polite">
        <div class="quiz-genie"><svg class="mascot-icon" aria-hidden="true"><use href="#mascot"></use></svg></div>
        <h2 class="quiz-question" id="quiz-question"></h2>
        <div class="option-grid" id="quiz-options"></div>
      </div>
      <div class="quiz-nav">
        <button class="back-btn" id="back-btn">← 上一題</button>
        <span class="quiz-step" id="quiz-step"></span>
      </div>
    </section>

    <section class="result" id="result" hidden aria-live="polite"></section>

  </main>

  <!-- 小遊戲彈窗（不確定時的骰子／抽籤／塔羅／輪盤） -->

  <!-- 終焉結局動畫 -->

    <p class="ending-line" id="ending-line"></p>
    <button class="enter-btn" id="ending-continue-btn">看看是什麼 →</button>
