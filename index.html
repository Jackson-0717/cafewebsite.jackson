<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什麼？</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 原創吉祥物插畫（供全站重複使用） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="mascot" viewBox="0 0 200 240">
        <radialGradient id="mascotBody" cx="38%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#ffe0ad"/>
          <stop offset="60%" stop-color="#ffb266"/>
          <stop offset="100%" stop-color="#ff8c3e"/>
        </radialGradient>
        <radialGradient id="mascotPetal" cx="40%" cy="30%" r="80%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#f2ecff"/>
        </radialGradient>
        <line x1="100" y1="86" x2="100" y2="42" stroke="#6fae5a" stroke-width="7" stroke-linecap="round"/>
        <g transform="translate(100,32)">
          <ellipse rx="11" ry="18" fill="url(#mascotPetal)" stroke="#e4dcff" stroke-width="1" transform="rotate(0)"/>
          <ellipse rx="11" ry="18" fill="url(#mascotPetal)" stroke="#e4dcff" stroke-width="1" transform="rotate(72)"/>
          <ellipse rx="11" ry="18" fill="url(#mascotPetal)" stroke="#e4dcff" stroke-width="1" transform="rotate(144)"/>
          <ellipse rx="11" ry="18" fill="url(#mascotPetal)" stroke="#e4dcff" stroke-width="1" transform="rotate(216)"/>
          <ellipse rx="11" ry="18" fill="url(#mascotPetal)" stroke="#e4dcff" stroke-width="1" transform="rotate(288)"/>
          <circle r="10" fill="#ffd23f"/>
        </g>
        <ellipse cx="76" cy="200" rx="16" ry="9" fill="#e07b2e"/>
        <ellipse cx="124" cy="200" rx="16" ry="9" fill="#e07b2e"/>
        <ellipse cx="100" cy="140" rx="58" ry="66" fill="url(#mascotBody)"/>
        <ellipse cx="80" cy="112" rx="18" ry="22" fill="#fffdf8"/>
        <ellipse cx="124" cy="112" rx="18" ry="22" fill="#fffdf8"/>
        <circle cx="84" cy="117" r="8.5" fill="#3a2618"/>
        <circle cx="128" cy="117" r="8.5" fill="#3a2618"/>
        <circle cx="81.5" cy="113.5" r="2.6" fill="#fff"/>
        <circle cx="125.5" cy="113.5" r="2.6" fill="#fff"/>
        <ellipse cx="62" cy="138" rx="9" ry="5.5" fill="#ff8ba0" opacity="0.55"/>
        <ellipse cx="142" cy="138" rx="9" ry="5.5" fill="#ff8ba0" opacity="0.55"/>
        <path d="M84 152 Q100 165 120 152" fill="none" stroke="#7a3f10" stroke-width="4" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <!-- 魔法陣入場動畫 -->
  <section id="intro-screen" class="intro-screen">
    <h1 class="intro-title">今天吃什麼？</h1>
    <p class="intro-subtitle">踏入魔法陣，召喚美食精靈</p>

    <div class="lamp-wrap" id="lamp-wrap">
      <svg class="mc-ring mc-ring-outer" viewBox="0 0 300 300">
        <circle cx="150" cy="150" r="140" fill="none" stroke="#ffcf6b" stroke-width="1.5" opacity="0.55"/>
        <circle cx="150" cy="150" r="128" fill="none" stroke="#ffb266" stroke-width="6" stroke-dasharray="2 12" opacity="0.8"/>
      </svg>
      <svg class="mc-ring mc-ring-mid" viewBox="0 0 300 300">
        <polygon points="150,55 227,187 73,187" fill="none" stroke="#ffd98a" stroke-width="1.5" opacity="0.75"/>
        <polygon points="150,245 73,113 227,113" fill="none" stroke="#ffd98a" stroke-width="1.5" opacity="0.75"/>
        <circle cx="150" cy="150" r="96" fill="none" stroke="#ffcf6b" stroke-width="1" opacity="0.5"/>
      </svg>
      <svg class="mc-ring mc-ring-inner" viewBox="0 0 300 300">
        <circle cx="150" cy="150" r="62" fill="none" stroke="#ffe0ad" stroke-width="4" stroke-dasharray="1 9" opacity="0.85"/>
        <circle cx="150" cy="42" r="3.5" fill="#ffe0ad"/>
        <circle cx="150" cy="258" r="3.5" fill="#ffe0ad"/>
        <circle cx="42" cy="150" r="3.5" fill="#ffe0ad"/>
        <circle cx="258" cy="150" r="3.5" fill="#ffe0ad"/>
      </svg>
      <div class="mc-glow"></div>
      <div class="genie" id="genie"><svg class="mascot-icon"><use href="#mascot"></use></svg></div>
      <div class="lamp" id="lamp" aria-label="啟動魔法陣"></div>
    </div>

    <p class="intro-hint" id="intro-hint">點一下魔法陣試試看 ✨</p>
    <button class="enter-btn" id="enter-btn" hidden>帶我進入美食世界 →</button>
  </section>

  <!-- 主體 App -->
  <div class="app" id="app" hidden>

    <header>
      <h1>🍽️ 今天吃什麼？</h1>
      <p class="subtitle">回答精靈的 5 個問題，讓祂幫你決定！</p>
    </header>

    <section class="quiz" id="quiz">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="quiz-genie"><svg class="mascot-icon"><use href="#mascot"></use></svg></div>
      <h2 class="quiz-question" id="quiz-question"></h2>
      <div class="chip-row" id="quiz-options"></div>
      <div class="quiz-nav">
        <button class="back-btn" id="back-btn">← 上一題</button>
        <span class="quiz-step" id="quiz-step"></span>
      </div>
    </section>

    <section class="result" id="result" hidden></section>

  </div>

  <!-- 小遊戲彈窗（不確定時的骰子／抽籤／塔羅／輪盤） -->
  <section id="minigame-overlay" class="minigame-overlay" hidden></section>

  <!-- 終焉結局動畫 -->
  <section id="ending-screen" class="ending-screen" hidden>
    <div class="ending-particles" id="ending-particles"></div>
    <p class="ending-eyebrow">你的選擇，終將迎來——</p>
    <h1 class="ending-title" id="ending-title"></h1>
    <p class="ending-line" id="ending-line"></p>
    <button class="enter-btn" id="ending-continue-btn">看看是什麼 →</button>
  </section>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
