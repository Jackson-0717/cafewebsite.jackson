  <!-- 原創吉祥物插畫（供全站重複使用） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="mascot" viewBox="0 0 200 240">
        <radialGradient id="mascotGlow" cx="50%" cy="45%" r="60%">
          <stop offset="0%" stop-color="#8fd6ff" stop-opacity="0.32"/>

        <linearGradient id="mascotFur" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffb15c"/>
          <stop offset="100%" stop-color="#ff7a3d"/>
        </linearGradient>
        <linearGradient id="mascotTail" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff7a3d"/>

        <circle cx="100" cy="130" r="98" fill="url(#mascotGlow)"/>

          <path d="M172 120 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z" opacity="0.8"/>

        <!-- 尾巴 -->
        <path d="M100 190 C74 206 66 226 82 236 C76 226 84 214 100 208 C116 214 124 226 118 236 C134 226 126 206 100 190 Z"

        <path d="M68 92 L52 54 L86 80 Z" fill="#3a2a1c"/>
        <path d="M132 92 L148 54 L114 80 Z" fill="#3a2a1c"/>

        <!-- 頭部 -->
        <ellipse cx="100" cy="146" rx="56" ry="50" fill="url(#mascotFur)"/>

        <!-- 口鼻 -->
        <path d="M76 162 Q100 186 124 162 Q112 176 100 176 Q88 176 76 162 Z" fill="#fff4e6"/>

        <path d="M104 137 Q117 129 130 138" fill="none" stroke="#2a1608" stroke-width="6" stroke-linecap="round"/>

        <circle cx="112" cy="133" r="2" fill="#fff"/>

  <!-- 魔法陣入場動畫 -->
  <section id="intro-screen" class="intro-screen">

    <div class="lamp-wrap" id="lamp-wrap">
      <div class="mc-scan"></div>
      <svg class="mc-ring mc-ring-outer" viewBox="0 0 300 300">
        <polygon points="150,14 253,82 253,218 150,286 47,218 47,82" fill="none" stroke="#5ad2ff" stroke-width="1.2" opacity="0.6"/>

        <rect x="146" y="284" width="8" height="8" fill="#8fe9ff"/>

        <rect x="284" y="146" width="8" height="8" fill="#8fe9ff"/>

      <svg class="mc-ring mc-ring-mid" viewBox="0 0 300 300">
        <polygon points="150,55 227,187 73,187" fill="none" stroke="#7be8ff" stroke-width="1.2" opacity="0.8"/>
        <polygon points="150,245 73,113 227,113" fill="none" stroke="#7be8ff" stroke-width="1.2" opacity="0.8"/>
        <circle cx="150" cy="150" r="96" fill="none" stroke="#3ec6ff" stroke-width="0.8" opacity="0.55"/>

        <circle cx="150" cy="150" r="62" fill="none" stroke="#bff3ff" stroke-width="2.5" stroke-dasharray="1 8" opacity="0.9"/>
        <rect x="146" y="38" width="8" height="8" fill="#d6faff" transform="rotate(45 150 42)"/>
        <rect x="146" y="254" width="8" height="8" fill="#d6faff" transform="rotate(45 150 258)"/>
        <rect x="38" y="146" width="8" height="8" fill="#d6faff" transform="rotate(45 42 150)"/>
        <rect x="254" y="146" width="8" height="8" fill="#d6faff" transform="rotate(45 258 150)"/>
      </svg>
      <div class="mc-glow"></div>
      <div class="lamp" id="lamp" role="button" tabindex="0" aria-label="啟動魔法陣"></div>
    </div>

    <p class="intro-hint" id="intro-hint">點一下魔法陣試試看 ✨</p>
    <button class="enter-btn" id="enter-btn" hidden>帶我進入美食世界 →</button>

    <header>
      <h1>🍽️ 今天吃什麼？</h1>
      <p class="subtitle">回答精靈的 5 個問題，讓祂幫你決定！</p>

    <section class="quiz" id="quiz">
      <div class="step-dots" id="step-dots"></div>
      <div class="quiz-slide" id="quiz-slide" aria-live="polite">
        <div class="quiz-genie"><svg class="mascot-icon" aria-hidden="true"><use href="#mascot"></use></svg></div>
        <h2 class="quiz-question" id="quiz-question"></h2>
        <div class="option-grid" id="quiz-options"></div>
      </div>
      <div class="quiz-nav">
        <button class="back-btn" id="back-btn">← 上一題</button>
        <span class="quiz-step" id="quiz-step"></span>
      </div>
    </section>

    <section class="result" id="result" hidden aria-live="polite"></section>

  </main>

    <button class="enter-btn" id="ending-continue-btn">看看是什麼 →</button>
